name: Task / chore
description: Tooling, CI, docs, dependencies or refactoring
title: "chore: "
labels: ["type: chore", "status: triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: What needs doing?
      description: Be concrete enough that someone can pick this up without asking.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks or observable outcome that lets us close this.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, prior art, or anything that constrains the solution.
